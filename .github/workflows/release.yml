name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 같은 태그로 중복 실행 시 이전 것 취소
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # 드래프트 릴리즈 사전 생성 (두 빌드 잡이 업로드 대상으로 사용)
  # ─────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Topica ${{ github.ref_name }}" \
            --notes "" \
            --draft \
            2>/dev/null || echo "Release already exists, continuing"

  # ─────────────────────────────────────────
  # Windows (NSIS only)
  # ─────────────────────────────────────────
  release-windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install

      - name: Build .NET sidecar (Windows x64, self-contained)
        shell: pwsh
        run: |
          dotnet publish backend/Topica.Api/Topica.Api.csproj `
            -c Release -r win-x64 --self-contained true `
            -o backend-pub
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item backend-pub/Topica.Api.exe `
            src-tauri/binaries/Topica.Api-x86_64-pc-windows-msvc.exe
          Get-ChildItem backend-pub -Include *.dll,*.dat -Recurse |
            ForEach-Object { Copy-Item $_.FullName -Destination src-tauri/binaries/ -Force }
          Get-ChildItem backend-pub -Filter *.json |
            Where-Object { $_.Name -ne 'appsettings.Development.json' } |
            ForEach-Object { Copy-Item $_.FullName -Destination src-tauri/binaries/ -Force }
          Remove-Item -Recurse -Force backend-pub

      - name: Build Tauri (Windows NSIS)
        shell: pwsh
        run: pnpm tauri build --bundles nsis

      - name: Upload installer and save sig
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag  = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"

          Write-Host "=== Bundle directory contents ==="
          Get-ChildItem src-tauri/target/release/bundle -Recurse | Select-Object FullName

          # Tauri v2 NSIS: *.exe (installer) + *.exe.sig (updater signature)
          $exe = Get-ChildItem src-tauri/target/release/bundle -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem src-tauri/target/release/bundle -Recurse -Filter "*-setup.exe.sig" | Select-Object -First 1

          if ($exe) { gh release upload $tag $exe.FullName --repo $repo --clobber }
          if (-not $sig) { throw "*-setup.exe.sig not found — TAURI_SIGNING_PRIVATE_KEY 확인 필요" }
          Copy-Item $sig.FullName windows.sig
          Write-Host "sig saved: $(Get-Content windows.sig | Select-Object -First 1)"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-sig
          path: windows.sig
          retention-days: 1

  # ─────────────────────────────────────────
  # Linux (AppImage only)
  # ─────────────────────────────────────────
  release-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libfuse2 file wget

      - name: Diagnose AppImage environment
        run: |
          echo "=== /tmp info ==="
          df -h /tmp && mount | grep tmp || true
          echo "=== fuse ==="
          ls /dev/fuse 2>/dev/null || echo "/dev/fuse not present"
          echo "=== linuxdeploy test ==="
          mkdir -p /home/runner/work/tmp
          wget -q -O /tmp/linuxdeploy "https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage"
          chmod +x /tmp/linuxdeploy
          TMPDIR=/home/runner/work/tmp APPIMAGE_EXTRACT_AND_RUN=1 /tmp/linuxdeploy --version 2>&1 || echo "linuxdeploy failed"
          echo "=== linuxdeploy-plugin-appimage test ==="
          wget -q -O /tmp/ld-plugin-appimage "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x /tmp/ld-plugin-appimage
          TMPDIR=/home/runner/work/tmp APPIMAGE_EXTRACT_AND_RUN=1 /tmp/ld-plugin-appimage --version 2>&1 || echo "plugin-appimage failed"

      - run: pnpm install

      - name: Build .NET sidecar (Linux x64, self-contained)
        run: |
          dotnet publish backend/Topica.Api/Topica.Api.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o backend-pub
          mkdir -p src-tauri/binaries
          cp backend-pub/Topica.Api \
            src-tauri/binaries/Topica.Api-x86_64-unknown-linux-gnu
          find backend-pub -maxdepth 1 \( -name "*.dll" -o -name "*.so" -o -name "*.dat" \) \
            -exec cp {} src-tauri/binaries/ \;
          find backend-pub -maxdepth 1 -name "*.json" \
            ! -name "appsettings.Development.json" \
            -exec cp {} src-tauri/binaries/ \;
          rm -rf backend-pub

      - name: Build Tauri (Linux AppImage)
        env:
          RUST_LOG: tauri_bundler=debug
          TMPDIR: /home/runner/work/tmp
        run: pnpm tauri build --bundles appimage

      - name: Upload AppImage and save sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"

          echo "=== Bundle directory contents ==="
          find src-tauri/target/release/bundle -type f | sort

          appimage=$(find src-tauri/target/release/bundle -name "*.AppImage" ! -name "*.tar.gz" | head -1)
          tar_gz=$(find src-tauri/target/release/bundle -name "*.AppImage.tar.gz" | head -1)
          sig=$(find src-tauri/target/release/bundle -name "*.AppImage.tar.gz.sig" | head -1)

          [ -n "$appimage" ] && gh release upload "$tag" "$appimage" --repo "$repo" --clobber
          [ -n "$tar_gz"  ] && gh release upload "$tag" "$tar_gz"  --repo "$repo" --clobber
          if [ -z "$sig" ]; then echo "ERROR: *.AppImage.tar.gz.sig not found"; exit 1; fi
          cp "$sig" linux.sig
          echo "sig saved: $(head -1 linux.sig)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-sig
          path: linux.sig
          retention-days: 1

  # ─────────────────────────────────────────
  # Publish: latest.json 생성 → 릴리즈 공개 → 오래된 릴리즈 정리
  # ─────────────────────────────────────────
  publish:
    needs: [release-windows, release-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-sig
          path: sigs

      - uses: actions/download-artifact@v4
        with:
          name: linux-sig
          path: sigs

      - name: Generate latest.json
        run: |
          cat > gen_latest.py << 'PYEOF'
          import json, os
          from datetime import datetime, timezone

          tag  = os.environ['TAG']
          repo = os.environ['REPO']
          ver  = tag.lstrip('v')
          pub_date = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          with open('sigs/windows.sig') as f:
              win_sig = f.read().strip()
          with open('sigs/linux.sig') as f:
              lin_sig = f.read().strip()

          data = {
              "version": ver,
              "notes": f"Topica {tag} 릴리즈",
              "pub_date": pub_date,
              "platforms": {
                  "windows-x86_64": {
                      "signature": win_sig,
                      "url": f"https://github.com/{repo}/releases/download/{tag}/topica_{ver}_x64-setup.exe"
                  },
                  "linux-x86_64": {
                      "signature": lin_sig,
                      "url": f"https://github.com/{repo}/releases/download/{tag}/topica_{ver}_amd64.AppImage.tar.gz"
                  }
              }
          }

          with open('latest.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f"Generated latest.json for {tag} (version {ver})")
          PYEOF
          python3 gen_latest.py

      - name: Upload latest.json and publish release
        run: |
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          gh release edit "$TAG" --draft=false --repo "$REPO"

      - name: Cleanup old published releases (keep 5 most recent)
        run: |
          gh release list --repo "$REPO" --limit 100 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft == false)] | .[5:] | .[].tagName' \
            | while read -r OLD_TAG; do
                echo "Deleting old release: $OLD_TAG"
                gh release delete "$OLD_TAG" --repo "$REPO" --yes --cleanup-tag || true
              done
